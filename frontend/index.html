<!DOCTYPE html>
<html>
<head>

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
   
<h2 id="welcomeText" class="welcome"></h2>
<div class="container">

    <div class="top-bar">

    <div>

        <h2>Task Manager</h2>

        

    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</div>

    <div class="task-input">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task"
        >

        <button onclick="addTask()">
            Add Task
        </button>

    </div>

    <table id="taskTable">

        <thead>
            <tr>
                <th>#</th>
                <th>Task</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
